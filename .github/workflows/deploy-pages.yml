name: Deploy web app to GitHub Pages

# 公開最小版（2026-09-18）：3D月球儀＋データ層＋CSVダウンロードのみ。
# JupyterLite（/app/ ノートブック）・データ一覧ページ（/data.html）はまだ含めない。
# 生成済みのデータ（webapp/react/src/data/*.generated.json・public/textures/）は
# リポジトリにコミット済みなので、このワークフローは React アプリのビルドだけでよい。
# ノートブック等を追加するときは、以前の版（git log でこのファイルの履歴を参照）に
# JupyterLite ビルド・データ一覧の合成ステップを戻す。

on:
  push:
    branches: [main, master]
    paths:
      - "webapp/react/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build 3D landing page
        working-directory: webapp/react
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
