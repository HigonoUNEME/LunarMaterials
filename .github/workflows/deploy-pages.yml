name: Deploy web app to GitHub Pages

# 公開最小版（2026-09-18）：3D月球儀＋データ層＋データ一覧（CSVダウンロード）。
# JupyterLite（/app/ ノートブック）はまだ含めない。用意でき次第、
# 以前の版（git log でこのファイルの履歴を参照）から jupyter lite build のステップを戻す。
#
# サイトの構成:
#   /            … 3D入口ページ（webapp/react を Vite でビルド）
#   /data.html   … データ一覧ページ（webapp/assemble.py が data/ の実ファイルから生成）
#   /data/       … CSV 実体（data.html から直接ダウンロード用）

on:
  push:
    branches: [main, master]
    paths:
      - "webapp/**"
      - "data/**"
      - "notebooks/moonkit.py"
      - "notebooks/moonkit_ml.py"
      - "docs/petit_inquiry_brief.md"
      - "docs/petit_inquiry_helpersheet.pdf"
      - "docs/petit_inquiry_mentor_notes.md"
      - "docs/teacher_guide_course.md"
      - "docs/worksheet_course.pdf"
      - "course/course_moonbase.xlsx"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build 3D landing page
        working-directory: webapp/react
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate データ一覧ページ（data.html）＋ CSV 実体
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat
          python webapp/assemble.py

      - name: Compose the site（Reactビルド＋データ一覧）
        run: |
          mkdir -p _site
          cp -r webapp/react/dist/. _site/
          cp webapp/data.html _site/data.html
          cp -r webapp/_dl _site/data
          du -sh _site
          ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
